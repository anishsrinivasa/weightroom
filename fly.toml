# fly launch --no-deploy   then   fly deploy
app = "keystone"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  KEYSTONE_ENV = "production"
  KEYSTONE_CHAIN = "base"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response]
    pristine = true

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/v1/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# The worker drains pending_certification. Separate process because a
# certification takes minutes on a GPU and must never block a request.
[processes]
  app = "uvicorn keystone.settings:app --factory --host 0.0.0.0 --port 8000"
  worker = "python -m keystone.cli worker --interval 30"
