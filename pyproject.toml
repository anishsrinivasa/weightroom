[project]
name = "keystone"
version = "0.1.0"
description = "Certification pipeline for open-weight models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "modal>=1.5",
    "huggingface_hub>=1.0",
    "pydantic>=2.10",
    "typer>=0.15",
    "rich>=13",
    "picklescan>=0.0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keystone"]

[project.scripts]
keystone = "keystone.cli:app"
