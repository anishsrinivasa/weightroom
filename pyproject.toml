[project]
name = "keystone"
version = "0.1.0"
description = "Certification pipeline for open-weight models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "modal>=1.5",
    "huggingface_hub>=1.0",
    "pydantic>=2.10",
    "typer>=0.15",
    "rich>=13",
    "picklescan>=0.0.20",
    "boto3>=1.35",
    "openai>=1.60",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "cryptography>=43",
    "pyjwt[crypto]>=2.9",
    "psycopg[binary]>=3.2",
    "pycryptodome>=3.20",
    "math-verify==0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keystone"]

[project.scripts]
keystone = "keystone.cli:app"

[dependency-groups]
# pytest was installed ad hoc and `uv sync` pruned it, taking the whole test
# suite with it. Declared so a fresh checkout can run the tests.
dev = [
    "pytest>=8",
    # `tests/test_inspect_benchmarks.py` imports this directly. It is pinned in
    # the Modal image and was missing locally, so those tests errored on import
    # rather than reporting anything about the adapters.
    "inspect-ai==0.3.263",
    "inspect-evals[swe-bench,gdpval]==0.19.0",
]
