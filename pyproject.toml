[project]
name = "keystone"
version = "0.1.0"
description = "Certification pipeline for open-weight models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "modal>=1.5",
    "huggingface_hub>=1.0",
    "pydantic>=2.10",
    "typer>=0.15",
    "rich>=13",
    "picklescan>=0.0.20",
    "boto3>=1.35",
    "openai>=1.60",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "cryptography>=43",
    "pyjwt[crypto]>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keystone"]

[tool.hatch.build.targets.wheel.force-include]
"src/keystone/static" = "keystone/static"

[project.scripts]
keystone = "keystone.cli:app"
