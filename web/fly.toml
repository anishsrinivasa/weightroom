app = "weightroom-gvelamoor"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  KEYSTONE_API_URL = "http://api.process.weightroom-gvelamoor-core.internal:8000"
  KEYSTONE_SESSION_COOKIE = "keystone_access_token"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
