    code_commit: "faceefdbde352d7aeba7fb563c0b48b11879b570"
    file: "llm_statistics.csv"
    sha256: "9cff23cde83b954fed36c3990711c41f73dca6a342a4907a249bfa14ed214695"
    permitted_use: "benchmarking, evaluation, research, and educational use under Ai2 Responsible Use Guidelines"
    model_population:
      open_weight_models: 100
    benchmarks:
      capability:
        - BBH
        - GPQA
        - IFEval
        - MATH
        - MMLU-Pro
        - MuSR
      safety:
        - BBQ
        - Do-Anything-Now
        - HarmBench
        - StrongREJECT
        - ToxiGen
        - TrustLLM-JailbreakTrigger
        - WildGuardTest
        - WildJailbreak
        - WMDP
        - XSTest
    relevance:
      - "common-protocol open-weight panel"
      - "general reasoning and latent safety"
      - "instruction-following versus safeguards"
      - "hazardous-knowledge proxy"
      - "initial underperformance residual analysis"
    limitations:
      - "contains benchmark aggregates rather than item uncertainty in the model-statistics file"
      - "WMDP is aggregated across domains in this file"
      - "does not cover coding, cyber CTF, biology lab, chemistry lab, or agentic capability directly"
      - "family field records model publisher and requires lineage normalization"
      - "not a release-risk calibration dataset"
    audit_status: "machine-readable source inspected and pinned"

