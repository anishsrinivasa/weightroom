  - id: safetywashing_2024
    title: "Safetywashing: Do AI Safety Benchmarks Actually Measure Safety Progress?"
    kind: "peer_reviewed_dataset_and_code"
    venue: "NeurIPS 2024 Datasets and Benchmarks Track"
    paper_url: "https://arxiv.org/abs/2407.21792"
    repository_url: "https://github.com/centerforaisafety/safetywashing"
    repository_commit: "bee302c11f174afb064d721123b16b810d34f4fd"
    license: "MIT"
    model_population:
      base_models: 27
      chat_models: 26
    relevance:
      - "general capability factor"
      - "capability-safety correlations"
      - "HarmBench domain slices"
      - "CyberSecEval 2"
      - "WMDP Bio/Chem/Cyber"
      - "base-versus-chat comparison"
    limitations:
      - "model panel is primarily 2023-2024"
      - "does not contain modern coding or agentic capability benchmarks"
      - "reported rows require canonical artifact resolution"
      - "correlations are descriptive, not release thresholds"
    audit_status: "machine-readable source inspected"

  - id: benchmirt_2026_model_statistics
    title: "BenchMIRT model statistics"
